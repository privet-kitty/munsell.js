name: CI (develop)

on:
  push:
    branches-ignore:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install Dependencies
        run: npm ci
      - name: Run test
        run: npm run test-coverage
